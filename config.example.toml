# Settings for node_state: email, and the few per-cluster rules Slurm cannot
# report.
#
# This is the shared template. Copy it to config.toml beside it and edit
# that: node_state reads config.toml when there is one, else this file.
# config.toml is git-ignored because it holds your SMTP password; keep it
# private (chmod 600).
#
# src/node_state/config.example.toml links here, so this file ships in the
# package.

# --- Email -------------------------------------------------------------------

# Slurm's own job emails: every probe and run command gets --mail-type and
# --mail-user, so a job you submit from one emails `user` on these states.
# [mail]
# user = "you@example.org"
# type = "BEGIN,END,FAIL"

# The dashboard's hourly email: press M in node_state to email the report of
# each cluster it shows, now and every hour until you quit, all in one
# conversation titled "node_state".
# [smtp]
# server = "mail.example.org"
# port = 587                       # STARTTLS; 465 for SSL
# sender = "you@example.org"       # also the login
# password = "..."
# recipient = "you@example.org"    # default: user in [mail]

# --- Clusters ------------------------------------------------------------------

# Keyed by ClusterName from `scontrol show config`. Most clusters need no
# entry: hardware, partitions, time tiers, accounts and limits are all read
# from Slurm. Add one only for rules Slurm cannot report.
#
#   walltimes      Walltimes to probe, as D-HH:MM:SS. Default: one per
#                  partition time limit, which is where routing tiers change.
#   gpu_counts     GPU counts to probe per type: "pow2" (1, 2, 4, ...; default),
#                  "all", or "whole_node" for sites that only allocate GPUs by
#                  node: each GPU request then asks for its whole node (all its
#                  GPUs, plus --exclusive --mem=0 for every CPU and all memory).
#   ssh            A login node to reach this cluster from elsewhere: a host
#                  name or ~/.ssh/config alias. Every cluster with one gets a
#                  tab; ssh asks for any password/MFA once, then the
#                  connection is reused (ControlMaster).

# RCL routes jobs by GPU request rather than walltime, so one time is enough.
[clusters.rcl]
walltimes = ["0-01:00:00"]

# Fir needs no site rules; the entry gives it a tab on other clusters.
[clusters.fir]
ssh = "fir.alliancecan.ca"

# Killarney needs no site rules; the entry gives it a tab on other clusters.
[clusters.killarney]
ssh = "killarney.alliancecan.ca"

# Tamia allocates GPUs only by whole node, and its submit filter rejects
# anything over a day.
[clusters.tamia]
ssh = "tamia.alliancecan.ca"
walltimes = ["0-03:00:00", "0-12:00:00", "1-00:00:00"]
gpu_counts = "whole_node"
